services:
  # 1. FastAPI Uygulamanız
  web:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - .:/app  # Kodlarınızda değişiklik yaptıkça konteynerin otomatik algılaması için (canlı geliştirme)
    environment:
      - DATABASE_URL=postgresql://fidelza:fidelza_password@postgres:5432/fidelza
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  # 2. PostgreSQL Veritabanı
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: fidelza
      POSTGRES_PASSWORD: fidelza_password
      POSTGRES_DB: fidelza
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 3. Redis Servisi
  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata: